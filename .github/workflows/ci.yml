name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write   # lets tagged builds publish a release

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test core
        run: swift test
      - name: Build app (ad-hoc signed)
        run: |
          brew install xcodegen
          make app
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: make dmg
      # Notarizing removes Gatekeeper's "unidentified developer" warning. It needs a Developer ID
      # certificate and these secrets: DEVELOPER_ID_P12, DEVELOPER_ID_PASSWORD, APPLE_ID,
      # APPLE_TEAM_ID, APPLE_APP_PASSWORD. See README → Releasing.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
